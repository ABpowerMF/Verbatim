name: Build Verbatim
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then echo "No zip found"; exit 1; fi
          echo "Using $ZIP"
          rm -rf Verbatim
          unzip -q -o "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: Verbatim
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: cp Verbatim/app/build/outputs/apk/release/app-release.apk Verbatim-${{ github.run_number }}.apk
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Verbatim build ${{ github.run_number }}
          files: Verbatim-${{ github.run_number }}.apk
